<script id="sbc-vctl-script">
(function(){

  var I={
    play:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    pause:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',

  function fmt(t){
    if(!isFinite(t)||t<0)t=0;
    t=Math.floor(t);
    var m=Math.floor(t/60),s=t%60;
    return m+':'+(s<10?'0':'')+s;

    var pb=document.createElement('button');pb.type='button';pb.className='sbc-vbtn';
    var mb=document.createElement('button');mb.type='button';mb.className='sbc-vbtn';
    var cur=document.createElement('span');cur.className='sbc-time';cur.textContent='0:00';
    var dur=document.createElement('span');dur.className='sbc-time';dur.textContent='0:00';

      var ok=isFinite(d)&&d>0;

      }

      var t=(seek.value/1000)*d;

      paint();
      try{v.currentTime=t;}catch(e){}
    }

    pb.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggle(v);});

    seek.addEventListener('input',seekTo);
    seek.addEventListener('change',function(){scrub=false;seekTo();});
    ['pointerup','pointercancel'].forEach(function(ev){
      document.addEventListener(ev,function(){if(scrub){scrub=false;syncTime();}});
    });
    seek.addEventListener('keyup',function(){scrub=false;syncTime();});

    v.addEventListener('play',syncPlay);
    v.addEventListener('pause',syncPlay);
    v.addEventListener('ended',syncPlay);
    v.addEventListener('volumechange',syncMute);

  }
  function boot(){setTimeout(start,0);}

  else window.addEventListener('load',boot);
